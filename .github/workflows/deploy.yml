name: Deploy CareerPilot

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE_FRONTEND: ${{ secrets.DOCKER_USERNAME }}/careerpilot-frontend
  DOCKER_IMAGE_BACKEND: ${{ secrets.DOCKER_USERNAME }}/careerpilot-backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies (Backend)
        run: cd backend && npm ci

      - name: Install Dependencies (Frontend)
        run: cd frontend && npm ci

      - name: Build Frontend
        run: cd frontend && npm run build

  docker-build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }},${{ env.DOCKER_IMAGE_BACKEND }}:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }},${{ env.DOCKER_IMAGE_FRONTEND }}:latest


