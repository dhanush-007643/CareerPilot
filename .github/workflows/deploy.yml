name: Deploy CareerPilot

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE_FRONTEND: yourdockerhub/careerpilot-frontend
  DOCKER_IMAGE_BACKEND: yourdockerhub/careerpilot-backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies (Backend)
        run: cd backend && npm ci

      - name: Install Dependencies (Frontend)
        run: cd frontend && npm ci

      - name: Build Frontend
        run: cd frontend && npm run build

  docker-build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }},${{ env.DOCKER_IMAGE_BACKEND }}:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }},${{ env.DOCKER_IMAGE_FRONTEND }}:latest

  deploy-to-k8s:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Replace Image Tags in K8s Manifests
        run: |
          sed -i 's|image: .*careerpilot-backend:latest|image: ${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}|g' k8s/backend-deployment.yaml
          sed -i 's|image: .*careerpilot-frontend:latest|image: ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}|g' k8s/frontend-deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/careerpilot-backend -n careerpilot --timeout=90s
          kubectl rollout status deployment/careerpilot-frontend -n careerpilot --timeout=90s
