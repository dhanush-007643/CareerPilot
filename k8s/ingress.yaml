apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: careerpilot-ingress
  namespace: careerpilot
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false" # Set to true when TLS is configured
spec:
  rules:
    - host: careerpilot.local # Change to your actual domain
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
